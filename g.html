    if (!host) return;
    var anyActive = !budgetRange;
    var base = 'font-family:inherit;font-size:10px;padding:7px 12px;border-radius:3px;cursor:pointer;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;border:1px solid #D85A30;background:#FFF;color:#D85A30';
    var active = 'font-family:inherit;font-size:10px;padding:7px 12px;border-radius:3px;cursor:pointer;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;border:1px solid #D85A30;background:#D85A30;color:#FFF';
    var html = '<button type="button" style="' + (anyActive ? active : base) + '" onclick="__tennerClearBudget()">Any</button>';
    html += BUCKETS.map(function(b, i) {
      var on = budgetRange && i >= budgetRange.lowIdx && i <= budgetRange.highIdx;
      return '<button type="button" style="' + (on ? active : base) + '" onclick="__tennerToggleBucket(' + i + ')">' + b.label + '</button>';
    }).join('');
    host.innerHTML = html;
  }

  function rewriteShopUrls() {
    var rh = budgetRh();
    document.querySelectorAll('a.shop').forEach(function(a) {
      var b = a.getAttribute('data-base-href') || a.getAttribute('href');
      if (!a.hasAttribute('data-base-href')) a.setAttribute('data-base-href', b);
      var url;
      try { url = new URL(b); } catch(e) { return; }
      url.searchParams.delete('rh');
      if (rh) url.searchParams.set('rh', rh);
      a.setAttribute('href', url.toString());
    });
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // A category "emoji" may be a short glyph OR an uploaded image, stored
  // either as a hosted URL or (pre-migration) as an inline data: URL. This
  // page previously escaped and printed whatever it got, so an uploaded icon
  // was rendered as its raw string — a 44,790-character data: URL splashed
  // across the gift page. Mirrors renderCatEmoji() in index.html.
  function renderEmoji(val, sizePx) {
    var s = sizePx || 32;
    var v = (typeof val === 'string' && val) ? val : '📋';
    var imgCss = 'width:' + s + 'px;height:' + s + 'px;object-fit:contain;vertical-align:middle';
    var fallback = '<span style="font-size:' + s + 'px;line-height:1">📋</span>';
    if ((/^https:\/\/[^\s"'<>]+$/i.test(v) && v.length <= 512)
        || /^data:image\/(png|jpe?g|gif|webp|svg\+xml);base64,/i.test(v)) {
      return '<img src="' + escapeHtml(v) + '" alt="" style="' + imgCss + '"'
        + ' onerror="this.outerHTML=' + escapeHtml(JSON.stringify(fallback)) + '">';
    }
    // Not an image and too long to be an emoji — never print it.
    if (v.length > 24) v = '📋';
    return '<span style="font-size:' + s + 'px;line-height:1">' + escapeHtml(v) + '</span>';
  }

  function daysUntilBirthday(bdStr) {
    if (!bdStr) return null;
    var parts = bdStr.split('-');
    if (parts.length < 3) return null;
    var m = parseInt(parts[1], 10), d = parseInt(parts[2], 10);
    if (!m || !d) return null;
    var today = new Date();
    var target = new Date(today.getFullYear(), m - 1, d);
    var msPerDay = 24 * 60 * 60 * 1000;
    var midnightToday = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    var diff = Math.round((target - midnightToday) / msPerDay);
    if (diff < 0) {
      target = new Date(today.getFullYear() + 1, m - 1, d);
      diff = Math.round((target - midnightToday) / msPerDay);
    }
    return diff;
  }

  function toggleTile(el) {
    el.classList.toggle('open');
    var sub = el.querySelector('.tile-sub');
    var isOpen = el.classList.contains('open');
    if (sub) sub.textContent = isOpen
      ? sub.dataset.openHint || 'Tap to close ↑'
      : sub.dataset.closedHint || 'Tap to shop ↓';
  }
  window.toggleTile = toggleTile;

  function render(data) {
    var root = document.getElementById('page-root');
    if (!data) {
      root.innerHTML = '<div class="empty"><div style="font-size:44px;margin-bottom:14px">🔗</div><div style="font-size:20px;font-weight:800;margin-bottom:6px;color:#2C2C2A;letter-spacing:-0.01em">This link isn\'t valid.</div><div style="font-size:13px;color:#5F5E5A">It may have been regenerated. Ask your friend for a fresh link.</div></div>';
      return;
    }
    var name = data.display_name || (data.handle ? '@' + data.handle : 'Your friend');
    var firstName = String(name).replace(/^@/, '').split(' ')[0] || 'They';
    var initials = (data.display_name || data.handle || '?').split(' ').map(function(w){return w[0];}).join('').toUpperCase().slice(0,2);
    document.title = 'Gifts for ' + name + ' — Tenner';

    var lists = (data.lists || []).filter(function(l){ return (l.items||[]).length > 0; });
    var heroPal = lists.length ? catColorKey(lists[0].category) : 'blush';

    // Countdown
    var days = daysUntilBirthday(data.birthday);
    var bday = data.birthday ? new Date(data.birthday + 'T00:00:00') : null;
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var countdown = '';
    if (bday) {
      var dayStr = months[bday.getMonth()] + ' ' + bday.getDate();
      var whenStr = days == null ? '' : (days === 0 ? 'TODAY 🎉' : days === 1 ? 'TOMORROW' : 'IN ' + days + ' DAYS');
      countdown = '<div class="badge">🎂 ' + escapeHtml(dayStr) + (whenStr ? ' · ' + whenStr : '') + '</div>';
    }

    var heroBgColor = {
      'mustard':'#F5B53422','gold':'#EFCB6822','terracotta':'#C4593E22','blush':'#F5D0C822',
      'sage':'#B8D0A822','forest':'#3A7A5C22','teal':'#2F9E8F22','mint':'#A8D8C822',
      'sky':'#A8C8E822','dusk':'#5A7AAA22','lavender':'#D9BEEC22','plum':'#7A4A8522',
      'coral':'#E8927C22','rose':'#D46A8022','salmon':'#F5A89622','peach':'#F5C09822'
    }[heroPal] || '#F5C09822';

    var avatarHtml = data.photo
      ? '<img src="' + escapeHtml(data.photo) + '" alt="">'
      : escapeHtml(initials);

    var html = '<div class="hero" style="--hero-accent:' + heroBgColor + '">'
      + '<div class="avatar-ring"><div class="avatar">' + avatarHtml + '</div></div>'
      + '<h1>Gifts for<br>' + escapeHtml(name) + '</h1>'
      + '<div class="sub">Built from ' + escapeHtml(name) + '\'s Top 10 lists on Tenner</div>'
      + countdown
      + '</div>';

    // Says plainly what the Shop button does. The picks and any notes are
    // theirs; the button runs an Amazon search for that pick rather than
    // recommending a specific product, and pretending otherwise would be
    // the dishonest version of this page.
    html += '<div class="disclosure">'
      + '<b>' + escapeHtml(firstName) + ' chose these picks</b> — the notes are theirs too. '
      + 'Each <b>Shop</b> button opens an Amazon search for that pick, so you choose the actual product.'
      + '<br><span style="opacity:0.85">Shop links are Amazon affiliate links. As an Amazon Associate, Tenner earns from qualifying purchases at no extra cost to you.</span>'
      + '</div>';

    if (lists.length) {
      html += '<div style="margin:8px 0 16px">'
        + '<div style="font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:#888780;font-weight:700;margin-bottom:8px;text-align:center">Budget</div>'
        + '<div id="budget-pills-host" style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center"></div>'
        + '</div>';
    }

    if (!lists.length) {
      html += '<div class="empty">' + escapeHtml(name) + ' hasn\'t shared any lists yet.</div>';
    } else {
      html += '<div class="sec-label">Inspired by their lists</div><div class="bento">';
      lists.forEach(function(l) {
        var pal = catColorKey(l.category);
        var emoji = l.emoji || '📋';
        var items = (l.items || []).slice(0, 5);
        var count = items.length;
        var closedHint = 'Top ' + count + ' pick' + (count !== 1 ? 's' : '') + ' · Tap to shop ↓';
        var openHint = 'Top ' + count + ' pick' + (count !== 1 ? 's' : '') + ' · Tap to close ↑';
        html += '<div class="tile t-' + pal + '" onclick="toggleTile(this)">'
          + '<div class="tile-emoji">' + renderEmoji(emoji, 32) + '</div>'
          + '<div class="tile-title">' + escapeHtml(l.category) + '</div>'
          + '<div class="tile-sub" data-closed-hint="' + escapeHtml(closedHint) + '" data-open-hint="' + escapeHtml(openHint) + '">' + escapeHtml(closedHint) + '</div>'
          + '<div class="picks" onclick="event.stopPropagation()">'
          + '<div class="guide">' + guideFor(l.category) + '</div>';
        var notes = (l.item_notes && typeof l.item_notes === 'object') ? l.item_notes : {};
        var totalInList = (l.items || []).length;
        items.forEach(function(it, i) {
          var url = amazonSearchUrl(it, l.category);
          // Their sentence if they wrote one; otherwise state only what is
          // already true and on the page. Never a generated opinion.
          var context = noteHtml(notes[it], firstName);
          if (!context) {
            context = '<div class="meta">'
              + (l.is_ranked ? ('Their #' + (i + 1) + ' of ' + totalInList) : ('One of their ' + totalInList))
              + '</div>';
          }
          // An unranked list has no #1, so numbering it would assert an order
          // its owner never chose. The app itself uses a dot for these.
          html += '<div class="pick"><div class="rank">' + (l.is_ranked ? (i+1) : '•') + '</div>'
            + '<div class="body"><div class="name">' + escapeHtml(it) + '</div>' + context + '</div>'
            + '<a class="shop" href="' + url + '" target="_blank" rel="noopener sponsored nofollow">Shop →</a></div>';
        });
        html += '</div></div>';
      });
      html += '</div>';
    }

    html += '<div style="text-align:center;font-size:12px;color:#5F5E5A;margin:22px 0 0;padding:12px 14px;background:#FFF;border:1px solid #E5E3DA;border-left:4px solid #D85A30;border-radius:3px">Prefer general gift ideas by category? <a href="/gifts/" style="color:#D85A30;text-decoration:none;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;font-size:11px">Browse categories →</a></div>';

    var footBtnLabel = _openedFromApp ? '← Back to Tenner' : 'Launch Tenner →';
    var footHeadline = _openedFromApp ? 'Head back to Tenner' : 'Make your own Top 10 lists';
    var footBlurb = _openedFromApp
      ? 'Return to your Gifts tab and keep exploring.'
      : 'Tenner is a free app for making Top 10 lists and comparing with friends.';
    html += '<div class="footer-block"><h2>' + footHeadline + '</h2>'
      + '<p>' + footBlurb + '</p>'
      + '<button class="btn" onclick="backToTenner()">' + footBtnLabel + '</button></div>';

    root.innerHTML = html;
    renderBudgetPills();
    rewriteShopUrls();
  }

  async function load() {
    var q = new URLSearchParams(location.search);
    var token = q.get('t') || (location.pathname.split('/g/')[1] || '').replace(/\/$/, '');
    if (!token) {
      document.getElementById('page-root').innerHTML = '<div class="empty"><div style="font-size:44px;margin-bottom:14px">🔗</div><div style="font-size:20px;font-weight:800;margin-bottom:6px;color:#2C2C2A;letter-spacing:-0.01em">No gift-guide link provided.</div><div style="font-size:13px;color:#5F5E5A">Ask your friend for their share link.</div></div>';
      return;
    }
    try {
      var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      var res = await sb.rpc('get_public_gift_data', { share_token: token });
      if (res.error) {
        console.error('RPC error:', res.error);
        showDebug('RPC error', res.error.message || JSON.stringify(res.error), token);
        return;
      }
      if (res.data == null) {
        showDebug('No profile found for token', 'The RPC succeeded but returned null. Token may not exist in the database.', token);
        return;
      }
      render(res.data);
    } catch(e) {
      console.error(e);
      showDebug('Exception', String(e && e.message || e), token);
    }
  }

  function showDebug(title, msg, token) {
    // Fallback UI that shows debugging info during setup. Once things work end-to-end,
    // this only fires on genuinely invalid tokens.
    var root = document.getElementById('page-root');
    root.innerHTML = '<div class="empty">'
      + '<div style="font-size:44px;margin-bottom:14px">🔗</div>'
      + '<div style="font-size:20px;font-weight:800;margin-bottom:6px;color:#2C2C2A;letter-spacing:-0.01em">This link isn\'t valid.</div>'
      + '<div style="font-size:13px;color:#5F5E5A;margin-bottom:20px">It may have been regenerated. Ask your friend for a fresh link.</div>'
      + '<details style="margin-top:20px;text-align:left;background:#F1EFE8;border-radius:8px;padding:12px;font-size:11px;color:#5F5E5A"><summary style="cursor:pointer;font-weight:600">Debug info</summary>'
      + '<div style="margin-top:8px"><strong>' + title + '</strong></div>'
      + '<div style="margin-top:4px;font-family:monospace;font-size:10px;word-break:break-all">' + (msg || '') + '</div>'
      + '<div style="margin-top:8px"><strong>Token:</strong> <span style="font-family:monospace;font-size:10px;word-break:break-all">' + (token || '(none)') + '</span></div>'
      + '</details>'
      + '</div>';
  }

  load();
})();
</script>
