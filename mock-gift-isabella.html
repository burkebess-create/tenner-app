<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gifts for Isabella Torres — Tenner</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #FDFCF8; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #2C2C2A; -webkit-font-smoothing: antialiased;
    max-width: 480px; margin: 0 auto;
  }

  /* Header */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; background: #FDFCF8;
    border-bottom: 1px solid #EAE3DC;
  }
  header img.logo { height: 28px; }
  header .back {
    background: #D85A30; color: #FFF; border: none; border-radius: 3px;
    padding: 10px 16px; font-size: 12px; font-weight: 800;
    letter-spacing: 0.14em; text-transform: uppercase;
    font-family: inherit; text-decoration: none;
    display: inline-flex; align-items: center; gap: 8px;
  }

  .page { padding: 20px 16px 40px; }

  /* Hero — clean card, thick coral left bar, photo + name + date pill */
  .hero {
    background: #FDFCF8; border: 1px solid #EAE3DC; border-left: 9px solid #D85A30;
    border-radius: 3px; padding: 30px 20px 26px; text-align: center;
    margin-bottom: 22px;
  }
  .avatar {
    width: 130px; height: 130px; border-radius: 999px;
    background: #F5F1EA; padding: 6px;
    margin: 0 auto 18px; overflow: hidden;
  }
  .avatar img {
    width: 100%; height: 100%; border-radius: 999px;
    object-fit: cover; display: block;
  }
  .hero h1 {
    font-size: 32px; font-weight: 800; letter-spacing: -0.02em;
    margin: 0 0 18px; color: #2C2C2A;
  }
  .hero .date-pill {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 12px 22px; border: 1.5px solid #D85A30; border-radius: 6px;
    background: #FDFCF8;
    color: #D85A30; font-size: 13px; font-weight: 800;
    letter-spacing: 0.14em; text-transform: uppercase;
  }
  .hero .date-pill .icon { font-size: 14px; }

  /* Section rule */
  .sec-rule {
    display: flex; align-items: center; gap: 14px; margin: 24px 0 18px;
  }
  .sec-rule .r { flex: 1; height: 2px; background: #D85A30; }
  .sec-rule .l {
    font-size: 12px; font-weight: 800; letter-spacing: 0.20em;
    text-transform: uppercase; color: #D85A30;
  }

  /* Tiles */
  .tile {
    border-radius: 3px; padding: 22px 22px; margin-bottom: 14px;
  }
  .tile .emoji {
    font-size: 30px; line-height: 1; margin-bottom: 14px; display: block;
  }
  .tile h2 {
    font-size: 26px; font-weight: 800; letter-spacing: -0.01em; margin: 0 0 8px;
    color: #2C2C2A;
  }
  .tile .meta {
    font-size: 13px; font-weight: 800; letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  /* Movies tile — pink bg, dark red left bar */
  .movies {
    background: #FBE6DE;
    border-left: 10px solid #A54523;
  }
  .movies .meta { color: #A54523; }

  /* TV Shows tile — teal bg, teal left bar, opened */
  .tv {
    background: #C9E4DA;
    border-left: 10px solid #2F7562;
  }
  .tv .meta { color: #1F5A4A; }

  /* Inset white card w/ picks */
  .picks {
    background: #FFF; border-radius: 3px;
    margin-top: 18px; overflow: hidden;
  }
  .pick {
    display: flex; align-items: center; gap: 16px;
    padding: 16px 18px;
    border-bottom: 1px solid #EAE3DC;
  }
  .pick:last-child { border-bottom: none; }
  .pick .rank {
    background: #2C2C2A; color: #FFF; border-radius: 3px;
    width: 32px; height: 32px; font-size: 15px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .pick .name {
    flex: 1; font-size: 17px; font-weight: 700; color: #2C2C2A;
  }
  .pick .shop {
    background: #D85A30; color: #FFF; border: none; border-radius: 3px;
    padding: 10px 18px; font-size: 12px; font-weight: 800;
    letter-spacing: 0.14em; text-transform: uppercase;
    text-decoration: none; font-family: inherit;
    display: inline-flex; align-items: center; gap: 6px;
  }
</style>
</head>
<body>

<header>
  <img class="logo" src="logo-horizontal.png" alt="Tenner">
  <a href="#" class="back">← Back to Tenner</a>
</header>

<div class="page">

  <div class="hero">
    <div class="avatar">
      <img src="assets/mock-isabella.jpg" alt="Isabella Torres">
    </div>
    <h1>Isabella Torres</h1>
    <div class="date-pill"><span class="icon">🗓️</span>Oct 14 · In 37 Days</div>
  </div>

  <div class="sec-rule"><div class="r"></div><div class="l">Inspired by their lists</div><div class="r"></div></div>

  <div class="tile movies">
    <span class="emoji">🎬</span>
    <h2>Movies</h2>
    <div class="meta">Top 3 picks · Tap to shop →</div>
  </div>

  <div class="tile tv">
    <span class="emoji">📺</span>
    <h2>TV Shows</h2>
    <div class="meta">Top 5 picks · Tap to close ↑</div>
    <div class="picks">
      <div class="pick"><div class="rank">1</div><div class="name">The Office</div><a class="shop" href="#">Shop →</a></div>
      <div class="pick"><div class="rank">2</div><div class="name">Real Housewives</div><a class="shop" href="#">Shop →</a></div>
      <div class="pick"><div class="rank">3</div><div class="name">Parks and Rec</div><a class="shop" href="#">Shop →</a></div>
      <div class="pick"><div class="rank">4</div><div class="name">Summer House</div><a class="shop" href="#">Shop →</a></div>
      <div class="pick"><div class="rank">5</div><div class="name">Abbott Elementary</div><a class="shop" href="#">Shop →</a></div>
    </div>
  </div>

</div>

</body>
</html>
